name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,esm,plot]'
      - run: ruff check apexppi scripts tests
      - run: pytest -q
      - run: python -m pip wheel --no-deps . --wheel-dir dist

  release-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install .
      - name: Download and verify v0.1.0 bundle
        run: |
          curl -LO https://github.com/XiaoqiongXia/apexppi/releases/download/v0.1.0/apexppi-bundle-v0.1.0.tar.gz
          curl -LO https://github.com/XiaoqiongXia/apexppi/releases/download/v0.1.0/apexppi-bundle-v0.1.0.tar.gz.sha256
          sha256sum --check apexppi-bundle-v0.1.0.tar.gz.sha256
          tar -xzf apexppi-bundle-v0.1.0.tar.gz
      - name: Run released model
        run: |
          apexppi-predict --bundle-dir apexppi-bundle-v0.1.0 --host-uniprot O00170 --pathogen-uniprot Q69027 --device cpu > prediction.json
          python -c 'import json; p=json.load(open("prediction.json")); assert p["model_type"] == "apexppi"; assert p["known_hpidb_positive"] is True; assert abs(p["interaction_probability"] - 0.9101908) < 1e-5'
