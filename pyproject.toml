[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexppi"
version = "0.1.0"
description = "Host-pathogen protein interaction prediction with heterogeneous graph neural networks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "torch",
  "torch-geometric",
]

[project.optional-dependencies]
esm = ["fair-esm"]
plot = ["matplotlib", "seaborn", "Pillow"]
dev = ["pytest==8.4.1", "ruff==0.14.2"]
all = [
  "fair-esm",
  "matplotlib",
  "seaborn",
  "Pillow",
  "requests",
  "networkx",
]

[project.scripts]
apexppi-predict = "apexppi.inference.predict_interaction:main"

[project.urls]
Homepage = "https://github.com/XiaoqiongXia/apexppi"
Issues = "https://github.com/XiaoqiongXia/apexppi/issues"

[tool.setuptools.packages.find]
include = ["apexppi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
